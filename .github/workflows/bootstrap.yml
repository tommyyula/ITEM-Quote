name: Bootstrap application source

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/itemquote.v10.part*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('bootstrap')
          parts = [(root / f'itemquote.v10.part{i:02d}').read_text() for i in range(7)]
          expected = '48fe49ca5fa99a67cb99a948df317a0544bbbd7f26822b2ab0270d437ce7a1b0'
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          # Two uploaded chunks were each one Base64 character short. They were
          # split on 18,000-character boundaries, so recover the omitted final
          # character in each chunk and verify against the immutable archive hash.
          for first in alphabet:
              for second in alphabet:
                  encoded = parts[0] + first + ''.join(parts[1:5]) + parts[5] + second + parts[6]
                  try:
                      archive = base64.b64decode(encoded, validate=True)
                  except ValueError:
                      continue
                  if hashlib.sha256(archive).hexdigest() == expected:
                      Path('/tmp/item-quote.tgz').write_bytes(archive)
                      print('Archive reconstruction and SHA-256 verification succeeded.')
                      raise SystemExit(0)

          raise SystemExit('Unable to reconstruct an archive matching the expected SHA-256.')
          PY
          tar -xzf /tmp/item-quote.tgz -C .
          rm -rf bootstrap

      - name: Commit restored application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Build database-backed interactive quotation app"
            git push
          fi
