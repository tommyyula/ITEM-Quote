name: Bootstrap application source

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/itemquote.v10.part*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Recover, reconstruct, and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('bootstrap')
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          expected_blobs = {
              0: 'f5c0e261920fad287015edeea2c2c427c6fb2f11',
              5: '7f13147c187e1d8786c9c2e633b07db3067689a5',
          }

          def recover_one_missing_base64_byte(path: Path, expected_hex: str) -> None:
              damaged = path.read_bytes()
              if len(damaged) != 17_999:
                  raise SystemExit(f'{path} has unexpected size {len(damaged)}')

              expected = bytes.fromhex(expected_hex)
              git_header = b'blob 18000\0'
              prefix_hash = hashlib.sha1(git_header)
              view = memoryview(damaged)
              alphabet_bytes = [bytes((value,)) for value in alphabet]

              for position in range(len(damaged) + 1):
                  suffix = view[position:]
                  for candidate in alphabet_bytes:
                      digest = prefix_hash.copy()
                      digest.update(candidate)
                      digest.update(suffix)
                      if digest.digest() == expected:
                          restored = damaged[:position] + candidate + damaged[position:]
                          path.write_bytes(restored)
                          print(f'Recovered {path.name}: inserted {candidate.decode()} at offset {position}.')
                          return
                  if position < len(damaged):
                      prefix_hash.update(view[position:position + 1])

              raise SystemExit(f'Could not recover {path} from its Git blob hash.')

          for index, expected_hash in expected_blobs.items():
              recover_one_missing_base64_byte(
                  root / f'itemquote.v10.part{index:02d}', expected_hash
              )

          encoded = b''.join(
              (root / f'itemquote.v10.part{i:02d}').read_bytes() for i in range(7)
          )
          archive = base64.b64decode(encoded, validate=True)
          expected_archive = '48fe49ca5fa99a67cb99a948df317a0544bbbd7f26822b2ab0270d437ce7a1b0'
          actual_archive = hashlib.sha256(archive).hexdigest()
          if actual_archive != expected_archive:
              raise SystemExit(
                  f'Archive SHA-256 mismatch: expected {expected_archive}, got {actual_archive}'
              )
          Path('/tmp/item-quote.tgz').write_bytes(archive)
          print('Archive reconstruction and SHA-256 verification succeeded.')
          PY
          tar -tzf /tmp/item-quote.tgz >/dev/null
          tar -xzf /tmp/item-quote.tgz -C .
          rm -rf bootstrap

      - name: Commit restored application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Build database-backed interactive quotation app"
            git push
          fi
