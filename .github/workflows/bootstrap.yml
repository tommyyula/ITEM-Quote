name: Diagnose source archive corruption

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate the missing Base64 character
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          root = Path('bootstrap')
          parts = [(root / f'itemquote.v10.part{i:02d}').read_bytes() for i in range(7)]
          parts[0] = parts[0][:1580] + b's' + parts[0][1580:]
          prefix = b''.join(parts[:5])
          damaged = parts[5]
          suffix = parts[6]
          probe_encoded = prefix + damaged + b'A' + suffix
          probe = base64.b64decode(probe_encoded, validate=True)
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          error_offset = None
          error_text = None
          for offset, value in enumerate(probe):
              try:
                  decoder.decompress(bytes((value,)))
              except zlib.error as error:
                  error_offset = offset
                  error_text = str(error)
                  break
          estimated_global = int((error_offset or 0) * 4 / 3)
          estimated_local = max(0, min(len(damaged), estimated_global - len(prefix)))
          print(f'PREFIX_BASE64_LENGTH={len(prefix)}')
          print(f'PART05_LENGTH={len(damaged)}')
          print(f'FIRST_DEFLATE_ERROR_BYTE={error_offset}')
          print(f'FIRST_DEFLATE_ERROR={error_text}')
          print(f'ESTIMATED_PART05_BASE64_OFFSET={estimated_local}')
          raise SystemExit('Diagnostic complete; inspect the printed offset.')
          PY
