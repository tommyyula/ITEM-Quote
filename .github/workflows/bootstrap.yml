name: Restore ITEM Quote application source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover and verify archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path('bootstrap')
          parts = [(root / f'itemquote.v10.part{i:02d}').read_bytes() for i in range(7)]
          parts[0] = parts[0][:1580] + b's' + parts[0][1580:]
          prefix = b''.join(parts[:5])
          damaged = parts[5]
          suffix = parts[6]
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          expected = '48fe49ca5fa99a67cb99a948df317a0544bbbd7f26822b2ab0270d437ce7a1b0'

          archive = None
          found = None
          for position in range(max(0, len(damaged) - 128), len(damaged) + 1):
              for value in alphabet:
                  encoded = prefix + damaged[:position] + bytes((value,)) + damaged[position:] + suffix
                  try:
                      candidate = base64.b64decode(encoded, validate=True)
                      gzip.decompress(candidate)
                  except Exception:
                      continue
                  if hashlib.sha256(candidate).hexdigest() == expected:
                      archive = candidate
                      found = (position, chr(value))
                      break
              if archive is not None:
                  break

          if archive is None:
              raise SystemExit('No SHA-256-valid repair found in the final 128 Base64 positions.')
          Path('/tmp/item-quote.tgz').write_bytes(archive)
          print(f'RECOVERED_PART05_OFFSET={found[0]}')
          print(f'RECOVERED_PART05_CHARACTER={found[1]}')
          print('Archive passed Base64, gzip CRC, tar, and SHA-256 validation.')
          PY
          tar -tzf /tmp/item-quote.tgz >/dev/null
          tar -xzf /tmp/item-quote.tgz -C .
          rm -rf bootstrap

      - name: Validate application source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f api/index.js
          test -f package.json
          test -f vercel.json
          node --check api/index.js
          if test -f app-server.js; then node --check app-server.js; fi

      - name: Commit restored application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build database-backed interactive quotation app"
          git push
